name: release

# Two jobs, two triggers.
#   render - a maintainer dispatches it; it writes values.tfvars + EXPECTED.md and
#            opens the release PR. Nobody types a digest into a file.
#   tag    - fires when that PR merges; it tags main and creates the GitHub Release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.1.0"
        required: true
      # Leave an image empty to carry its pin forward from the previous release.
      # Fill in only what this release moves. The first release needs all six.
      keygen_digest:
        description: "keygen image digest (sha256:...) — empty = unchanged"
        required: false
        default: ""
      keygen_sha:
        description: "keygen source commit (full 40-hex) — empty = unchanged"
        required: false
        default: ""
      teecryptor_digest:
        description: "teecryptor image digest (sha256:...) — empty = unchanged"
        required: false
        default: ""
      teecryptor_sha:
        description: "teecryptor source commit (full 40-hex) — empty = unchanged"
        required: false
        default: ""
      zeek_digest:
        description: "zee-k image digest (sha256:...) — empty = unchanged"
        required: false
        default: ""
      zeek_sha:
        description: "zee-k source commit (full 40-hex) — empty = unchanged"
        required: false
        default: ""
      ceremony:
        description: "Ceremony release - grants write access for the key ceremony"
        type: boolean
        default: false
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  render:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
      IN_KEYGEN_DIGEST: ${{ inputs.keygen_digest }}
      IN_KEYGEN_SHA: ${{ inputs.keygen_sha }}
      IN_TEECRYPTOR_DIGEST: ${{ inputs.teecryptor_digest }}
      IN_TEECRYPTOR_SHA: ${{ inputs.teecryptor_sha }}
      IN_ZEEK_DIGEST: ${{ inputs.zeek_digest }}
      IN_ZEEK_SHA: ${{ inputs.zeek_sha }}
      CEREMONY: ${{ inputs.ceremony }}
      COMPUTE_PROJECT: ${{ vars.FHENIX_COMPUTE_PROJECT }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # An unchanged image should not be retyped. Retyping is how a digest and a
      # commit drift apart, and the previous tag already holds the proven pair.
      # Anything left empty is read back from that tag's values.tfvars.
      - name: Resolve each pin, carrying forward what did not change
        run: |
          set -euo pipefail
          # No pipe: `git tag | head` takes SIGPIPE on a repo with many tags, and
          # `pipefail` turns that into a silent abort with no output at all.
          prev_tag="$(git for-each-ref --sort=-v:refname --count=1 --format='%(refname:short)' 'refs/tags/v*')"
          prev_file=""
          if [[ -n "$prev_tag" ]] && git show "$prev_tag:values.tfvars" > prev-values.tfvars 2>/dev/null; then
            prev_file=prev-values.tfvars
          else
            prev_tag=""
          fi

          # pins.awk prints "<key> <value>" for every pin in a rendered var-file.
          lookup() {
            [[ -n "$prev_file" ]] || return 0
            awk -f .github/scripts/pins.awk "$prev_file" | awk -v k="$1" '$1 == k { print $2 }'
          }

          # Sets RESOLVED and ORIGIN. Called directly, never in a subshell, so a
          # missing value stops the run here instead of rendering a broken file.
          resolve() {
            local label="$1" key="$2" supplied="$3"
            if [[ -n "$supplied" ]]; then
              RESOLVED="$supplied"; ORIGIN="supplied"; return 0
            fi
            RESOLVED="$(lookup "$key")"
            if [[ -z "$RESOLVED" ]]; then
              if [[ -n "$prev_tag" ]]; then
                echo "::error::$label is empty, and $prev_tag does not carry it. Fill it in."
              else
                echo "::error::$label is empty and there is no previous release to carry it from. Fill it in."
              fi
              exit 1
            fi
            ORIGIN="carried from $prev_tag"
          }

          {
            echo "| Pin | Value | Source |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          emit() {  # label, pins key, supplied value, env var name, digest|sha
            resolve "$1" "$2" "$3"
            case "$5" in
              digest) [[ "$RESOLVED" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::$1 is not a canonical digest: '$RESOLVED'"; exit 1; } ;;
              sha)    [[ "$RESOLVED" =~ ^[0-9a-f]{40}$ ]]        || { echo "::error::$1 is not a full 40-hex commit: '$RESOLVED'"; exit 1; } ;;
            esac
            echo "$4=$RESOLVED" >> "$GITHUB_ENV"
            echo "| $1 | \`$RESOLVED\` | $ORIGIN |" >> "$GITHUB_STEP_SUMMARY"
          }

          # 6. Half a pair is almost always a half-filled form. Carrying the old
          # commit next to a new digest fails later as "the proof does not hold",
          # which reads like a compromised image rather than a typo.
          pair() {  # label, digest, sha
            if [[ -n "$2" && -z "$3" ]] || [[ -z "$2" && -n "$3" ]]; then
              echo "::error::fill both the digest and the commit for $1, or leave both empty to carry the pair forward."
              exit 1
            fi
          }
          pair keygen     "$IN_KEYGEN_DIGEST"     "$IN_KEYGEN_SHA"
          pair teecryptor "$IN_TEECRYPTOR_DIGEST" "$IN_TEECRYPTOR_SHA"
          pair zee-k      "$IN_ZEEK_DIGEST"       "$IN_ZEEK_SHA"

          emit "keygen digest"     keygen         "$IN_KEYGEN_DIGEST"     KEYGEN_DIGEST     digest
          emit "keygen commit"     keygen-sha     "$IN_KEYGEN_SHA"        KEYGEN_SHA        sha
          emit "teecryptor digest" teecryptor     "$IN_TEECRYPTOR_DIGEST" TEECRYPTOR_DIGEST digest
          emit "teecryptor commit" teecryptor-sha "$IN_TEECRYPTOR_SHA"    TEECRYPTOR_SHA    sha
          emit "zee-k digest"      zee-k          "$IN_ZEEK_DIGEST"       ZEEK_DIGEST       digest
          emit "zee-k commit"      zee-k-sha      "$IN_ZEEK_SHA"          ZEEK_SHA          sha

          rm -f prev-values.tfvars

      - name: Reject a malformed tag, digest, commit or compute project
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag must be vX.Y.Z, got '$TAG'"
            exit 1
          fi
          for d in "$KEYGEN_DIGEST" "$TEECRYPTOR_DIGEST" "$ZEEK_DIGEST"; do
            if ! [[ "$d" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::not a canonical digest: '$d'"
              exit 1
            fi
          done
          # The partner proves digest+commit together against the public
          # attestation before it pins anything. A short SHA never matches the
          # attested source digest, so reject one here rather than at the
          # partner's plan.
          for c in "$KEYGEN_SHA" "$TEECRYPTOR_SHA" "$ZEEK_SHA"; do
            if ! [[ "$c" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::not a full 40-hex commit sha: '$c'"
              exit 1
            fi
          done
          if [[ -z "$COMPUTE_PROJECT" ]]; then
            echo "::error::repository variable FHENIX_COMPUTE_PROJECT is not set"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::tag $TAG already exists; a tag is never moved"
            exit 1
          fi

      # The same check every partner's apply runs. A correctly shaped but wrong
      # source_sha passes the regex above, ships in the tag, and then fails at
      # EVERY partner with "DO NOT PIN THIS DIGEST" — one typo, N incidents.
      # The runner has gh, jq and curl. FHENIX_PROVENANCE_TOKEN lifts the anonymous
      # 60/hour limit, which GitHub-hosted runners share by IP. The script uses
      # that name, not GITHUB_TOKEN, so a partner's ambient token never applies.
      # FHENIX_BUNDLE_OUT makes the script keep each bundle it proved, and the tag
      # then carries them. A partner's apply reads those files instead of calling
      # api.github.com, so the gate needs no GitHub endpoint at plan time.
      #
      # Shipping the bundle weakens nothing: gh checks its signature, the
      # certificate identity and the subject digest against Sigstore's public
      # trust root, exactly as it does for one it downloads.
      #
      # A pin that carried forward already has its bundle in the checkout, so the
      # script uses that copy and writes nothing. The file name carries the
      # digest, so nothing is ever overwritten in place.
      - name: Prove each digest came from the commit beside it, and keep the proof
        env:
          FHENIX_PROVENANCE_TOKEN: ${{ github.token }}
          FHENIX_BUNDLE_OUT: partner/bundles
        run: |
          set -euo pipefail
          # Both `ls` below and `git add` in the PR step fail on a missing path,
          # and the PR step fails after the commit sequence has started. The
          # directory is committed today, but nothing else guarantees it.
          mkdir -p partner/bundles
          partner/verify-image.sh keygen     "$KEYGEN_DIGEST"     "$KEYGEN_SHA"
          partner/verify-image.sh teecryptor "$TEECRYPTOR_DIGEST" "$TEECRYPTOR_SHA"
          partner/verify-image.sh zee-k      "$ZEEK_DIGEST"       "$ZEEK_SHA"

          # Drop the bundles of digests this release no longer pins. Without this
          # the directory keeps every digest we ever shipped. Match the whole
          # name, image included, so a right digest under a wrong image name is
          # dropped too — verify-image.sh would never read that file.
          keep=" keygen-${KEYGEN_DIGEST#sha256:} teecryptor-${TEECRYPTOR_DIGEST#sha256:} zee-k-${ZEEK_DIGEST#sha256:} "
          for f in partner/bundles/*.jsonl; do
            [[ -e "$f" ]] || continue
            name="${f##*/}"
            case "$keep" in
              *" ${name%.jsonl} "*) ;;
              *) echo "dropping stale bundle $f"; rm -f "$f" ;;
            esac
          done
          ls -l partner/bundles

      - name: Render values.tfvars and EXPECTED.md
        run: |
          set -euo pipefail
          if [[ "$CEREMONY" == "true" ]]; then
            printf '%s\n' \
              '# Ceremony release: our enclave may add ONE version to each secret.' \
              '# The next release drops this line; re-applying then removes the' \
              '# write binding (the plan shows exactly 2 destroys).' \
              'grant_write_access = true' > grant.txt
            word='GRANTED - this is a ceremony release'
            ceremony_bool='true'
          else
            # Nothing. The module default is false, and a var-file cannot enforce
            # it anyway: -var wins over -var-file. A comment claiming otherwise
            # would be a promise this file cannot keep.
            : > grant.txt
            word='frozen'
            ceremony_bool='false'
          fi
          render() {
            sed -e "s|__TAG__|$TAG|g" \
                -e "s|__COMPUTE_PROJECT__|$COMPUTE_PROJECT|g" \
                -e "s|__KEYGEN_DIGEST__|$KEYGEN_DIGEST|g" \
                -e "s|__KEYGEN_SHA__|$KEYGEN_SHA|g" \
                -e "s|__TEECRYPTOR_DIGEST__|$TEECRYPTOR_DIGEST|g" \
                -e "s|__TEECRYPTOR_SHA__|$TEECRYPTOR_SHA|g" \
                -e "s|__ZEEK_DIGEST__|$ZEEK_DIGEST|g" \
                -e "s|__ZEEK_SHA__|$ZEEK_SHA|g" \
                -e "s|__KEYGEN_DIGEST_HEX__|${KEYGEN_DIGEST#sha256:}|g" \
                -e "s|__TEECRYPTOR_DIGEST_HEX__|${TEECRYPTOR_DIGEST#sha256:}|g" \
                -e "s|__ZEEK_DIGEST_HEX__|${ZEEK_DIGEST#sha256:}|g" \
                -e "s|__CEREMONY_WORD__|$word|g" \
                -e "s|__CEREMONY_BOOL__|$ceremony_bool|g" \
                "$1"
          }
          # `sed r` splices the file in, so the multi-line ceremony block survives.
          render .github/release-templates/values.tfvars.tmpl \
            | sed -e '/__GRANT_WRITE_ACCESS__/r grant.txt' \
                  -e '/__GRANT_WRITE_ACCESS__/d' \
            > values.tfvars
          # Compare against the previous tag so EXPECTED.md states the exact
          # before/after, not just a shape. Pure git - no credentials needed.
          prev_tag="$(git for-each-ref --sort=-v:refname --count=1 --format='%(refname:short)' 'refs/tags/v*')"
          prev_file=""
          if [[ -n "$prev_tag" ]] && git show "$prev_tag:values.tfvars" > prev-values.tfvars 2>/dev/null; then
            prev_file=prev-values.tfvars
          else
            prev_tag=""
          fi
          .github/scripts/render-diff.sh "$prev_tag" "$prev_file" values.tfvars "$TAG" > diff.md

          render .github/release-templates/EXPECTED.md.tmpl \
            | sed -e '/__PREVIOUS_DIFF__/r diff.md' \
                  -e '/__PREVIOUS_DIFF__/d' \
            > EXPECTED.md
          rm -f grant.txt diff.md prev-values.tfvars
          echo "--- values.tfvars"
          cat values.tfvars
          echo "--- EXPECTED.md"
          cat EXPECTED.md

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Check the rendered var-file and the module
        run: |
          set -euo pipefail
          # fmt parses the HCL, so a malformed render fails here.
          terraform fmt -check -diff values.tfvars
          terraform -chdir=partner init -backend=false -input=false
          terraform -chdir=partner validate
          # `validate` ignores var-files, so evaluate the rendered one against the
          # real variable declarations. This catches a field renamed on one side
          # of the boundary, and exercises every `validation` block.
          #
          # `console` refuses to run without an initialised backend, and this repo
          # configures a gcs backend it has no credentials for. A local-backend
          # override gives console what it needs and touches no committed file.
          printf 'terraform {\n  backend "local" {}\n}\n' > partner/zz_console_override.tf
          terraform -chdir=partner init -input=false > /dev/null
          echo 'var.attested_readers' \
            | terraform -chdir=partner console -var-file=../values.tfvars -var partner_project_id=render-check
          rm -f partner/zz_console_override.tf
          # A real `plan` needs GCP credentials, which this repo deliberately has
          # none of. The var-file is proved against a live project by the partner,
          # and by the Fhenix re-apply of staging from the tag - not here.

      - name: Prepend the CHANGELOG entry
        run: |
          set -euo pipefail
          if [[ "$CEREMONY" == "true" ]]; then
            ceremony_line='**Ceremony release** - write access is granted for this apply.'
          else
            ceremony_line='Not a ceremony release.'
          fi
          printf '%s\n' \
            "## $TAG - $(date -u +%Y-%m-%d)" \
            "" \
            "$ceremony_line" \
            "" \
            "| Image | Digest | Source commit |" \
            "|---|---|---|" \
            "| keygen | \`$KEYGEN_DIGEST\` | \`$KEYGEN_SHA\` |" \
            "| teecryptor | \`$TEECRYPTOR_DIGEST\` | \`$TEECRYPTOR_SHA\` |" \
            "| zee-k | \`$ZEEK_DIGEST\` | \`$ZEEK_SHA\` |" \
            "" > entry.md
          awk 'NR==FNR { e = e $0 ORS; next }
               !done && /^## / { printf "%s", e; done = 1 }
               { print }' entry.md CHANGELOG.md > CHANGELOG.new
          mv CHANGELOG.new CHANGELOG.md
          rm entry.md

      - name: Open the release PR
        run: |
          set -euo pipefail
          printf '%s\n' \
            "Rendered by \`release.yml\`. Merging this PR tags \`main\` as \`$TAG\`" \
            "and creates the GitHub Release." \
            "" \
            "| Image | Digest | Source commit |" \
            "|---|---|---|" \
            "| keygen | \`$KEYGEN_DIGEST\` | \`$KEYGEN_SHA\` |" \
            "| teecryptor | \`$TEECRYPTOR_DIGEST\` | \`$TEECRYPTOR_SHA\` |" \
            "| zee-k | \`$ZEEK_DIGEST\` | \`$ZEEK_SHA\` |" \
            "" \
            "Ceremony: \`$CEREMONY\`. Compute project: \`$COMPUTE_PROJECT\`." \
            "" \
            "Review \`values.tfvars\` and \`EXPECTED.md\` against the build outputs" \
            "before merging." > body.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="release/$TAG"
          git checkout -b "$branch"
          git add -f values.tfvars EXPECTED.md CHANGELOG.md
          git add -A partner/bundles
          git commit -m "release $TAG"
          git push -u origin "$branch"
          gh pr create --title "release $TAG" --base main --head "$branch" --body-file body.md

  tag:
    # base.ref matters: without it any merged PR whose title starts "release v"
    # tags whatever it merged into, on any branch.
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.merged == true
      && github.event.pull_request.base.ref == 'main'
      && startsWith(github.event.pull_request.title, 'release v')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR_TITLE: ${{ github.event.pull_request.title }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Tag main and create the Release
        run: |
          set -euo pipefail
          tag="${PR_TITLE#release }"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::PR title does not carry a vX.Y.Z tag: '$PR_TITLE'"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::tag $tag already exists; a tag is never moved"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$tag"
          git push origin "$tag"
          gh release create "$tag" --title "$tag" --notes "Release notes follow."

      - name: Write the source-tarball sha256 into the release notes
        run: |
          set -euo pipefail
          tag="${PR_TITLE#release }"
          url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${tag}.tar.gz"
          # GitHub generates the tarball on first request; retry until it is there.
          ok=""
          for _ in 1 2 3 4 5; do
            if curl -fsSL "$url" -o src.tar.gz; then ok=1; break; fi
            sleep 5
          done
          if [[ -z "$ok" ]]; then
            echo "::error::could not fetch $url to hash it"
            exit 1
          fi
          sum=$(sha256sum src.tar.gz | cut -d" " -f1)
          printf '%s\n' \
            "Source tarball \`${tag}.tar.gz\` sha256:" \
            "" \
            '```' \
            "$sum" \
            '```' \
            "" \
            "Verify what you cloned:" \
            "" \
            '```bash' \
            "curl -sL $url | shasum -a 256" \
            '```' \
            "" \
            "See \`CHANGELOG.md\` and \`EXPECTED.md\` at this tag." > notes.md
          gh release edit "$tag" --notes-file notes.md
